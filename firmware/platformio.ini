; NÖBET — Node Firmware
; Hedef: ESP32 DevKit V1 (DOIT) + RC522
;
; Komutlar (pio PATH'te değilse `python -m platformio ...`):
;   python -m platformio run                               -> derle
;   python -m platformio run -t upload --upload-port COM7  -> USB'den yükle
;   python -m platformio device monitor -p COM7 -b 115200  -> seri monitör
;   python -m platformio run -e ota -t upload              -> kablosuz yükle

[env]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=1

; --- USB ile yükleme (varsayılan) ---
[env:esp32dev]
upload_speed = 921600
upload_port  = COM7

; --- OTA ile yükleme (Faz 3) ---
; Cihaz ağa bağlandıktan sonra kullanılır. Parola ortam değişkeninden
; okunur ve include/secrets.h içindeki OTA_PASS ile aynı olmalı:
;   NOBET_OTA_PASS=... pio run -e ota -t upload
[env:ota]
upload_protocol = espota
upload_port     = giris-01.local
upload_flags    =
    --auth=${sysenv.NOBET_OTA_PASS}
