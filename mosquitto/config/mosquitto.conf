# NÖBET — Mosquitto yapılandırması (Faz 4)
# Kontrat §2.1 topic yapısı · §5: prototipte TLS yok (Faz 11'de eklenecek)

listener 1883 0.0.0.0

# Kimlik doğrulama zorunlu. Ağdaki herkes sahte olay yayınlayamasın.
allow_anonymous false
password_file /mosquitto/config/passwd

# Kalıcı oturum ve retained mesajlar diske yazılır.
# Bu, LWT'nin (§2.5) ve backend'in kalıcı oturumunun yeniden başlatmaya
# dayanması için gerekli.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Düğüm sayısı az, mesajlar küçük. Varsayılanlar fazlasıyla yeterli;
# yine de bir düğüm arızalanıp sel yaratırsa broker'ı korusun.
max_inflight_messages 40
max_queued_messages 2000
message_size_limit 8192
